apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: vdd
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: 'virtual-deadlock-detection'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['app:8080']