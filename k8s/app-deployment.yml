apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: vdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vdd-app
  template:
    metadata:
      labels:
        app: vdd-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: app
          image: z0ker69/patent_26-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # application.yml binds server.port to ${PORT:8081}, but the
            # Service and containerPort target 8080. Without this the pod
            # listens on 8081 and the Service gets connection refused.
            - name: PORT
              value: "8080"
            # The default profile starts the interactive Spring Shell, which
            # has no terminal in a pod. docker-compose already uses "web".
            - name: SPRING_PROFILES_ACTIVE
              value: web
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: virtual_deadlock_detection
            - name: DB_USERNAME
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vdd-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"