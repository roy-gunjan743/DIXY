apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: vdd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vdd-app
  template:
    metadata:
      labels:
        app: vdd-app
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      containers:
        - name: app
          image: z0ker69/patent_26-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: virtual_deadlock_detection
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vdd-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"