spring:
  application:
    name: virtual_deadlock_detection
    app:
      seed-data:
        enabled:

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:virtual_deadlock_detection}
    username: ${DB_USERNAME:root}
    # No default here on purpose: startup fails fast if DB_PASSWORD isn't set,
    # instead of silently falling back to a credential checked into source control.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

security:
  # Comma-separated list of origins allowed to call the API (used by SecurityConfig's CORS setup).
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO