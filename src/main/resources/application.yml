spring:
  application:
    name: virtual_deadlock_detection
    app:
      seed-data:
        enabled: false

  shell:
    interactive:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:virtual_deadlock_detection}?options=-c%20timezone=UTC
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:Debangana1234@_}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8081}

security:
  # Comma-separated list of origins allowed to call the API (used by SecurityConfig's CORS setup).
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    root: INFO

---
# CLI mode: pure detection + interactive shell, no web server, no port binding
spring:
  config:
    activate:
      on-profile: cli
  main:
    web-application-type: none
  shell:
    interactive:
      enabled: true
    noninteractive:
      enabled: false

---
# Web mode: dashboard/API only, shell disabled so it doesn't block the terminal
spring:
  config:
    activate:
      on-profile: web
  main:
    web-application-type: servlet
  shell:
    interactive:
      enabled: false
    noninteractive:
      enabled: false