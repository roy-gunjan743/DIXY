services:
  mysql:
    image: mysql:8.4
    container_name: vdd-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: gupi@1234
      MYSQL_DATABASE: virtual_deadlock_detection
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pgupi@1234"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: vdd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: src/main/java/com/virtual_deadlock_detection/devOps/dev.dockerfile
    container_name: vdd-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: virtual_deadlock_detection
      DB_USERNAME: root
      DB_PASSWORD: gupi@1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
  prometheus:
    image: prom/prometheus:latest
    container_name: vdd-prometheus
    restart: unless-stopped
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
      image: grafana/grafana:latest
      container_name: vdd-grafana
      restart: unless-stopped
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
      ports:
        - "3000:3000"
      volumes:
        - grafana_data:/var/lib/grafana
      depends_on:
        - prometheus

volumes:
  mysql_data:
  grafana_data:
