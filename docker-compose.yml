services:
  postgres:
    image: postgres:16
    container_name: vdd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: gupi@1234
      POSTGRES_DB: virtual_deadlock_detection
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d virtual_deadlock_detection"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: vdd-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: src/main/java/com/virtual_deadlock_detection/devOps/dev.dockerfile
    container_name: vdd-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: virtual_deadlock_detection
      DB_USERNAME: postgres
      DB_PASSWORD: gupi@1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
  prometheus:
    image: prom/prometheus:latest
    container_name: vdd-prometheus
    restart: unless-stopped
    volumes:
      - ./devops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:9.5.15
    container_name: vdd-grafana
    restart: unless-stopped
    user: "0"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  grafana_data: