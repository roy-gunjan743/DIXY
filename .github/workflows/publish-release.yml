name: Publish DIXY Release

# Automatically builds and publishes prebuilt release artifacts
# (dixy-agent.jar, dixy-cli.jar, dixy.bat, dixy.sh) to GitHub Releases.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.4'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build agent + CLI jars
        run: ./gradlew clean agentJar bootJar -x test

      - name: Stage release assets
        run: |
          mkdir -p release-staging
          VERSION="${GITHUB_REF_NAME#v}"
          printf '%s\n' "$VERSION" > release-staging/VERSION
          cp build/libs/*-agent.jar release-staging/dixy-agent.jar
          rm -f build/libs/*-agent.jar build/libs/*-plain.jar
          cp build/libs/*.jar release-staging/dixy-cli.jar
          if [ -f dixy.sh ]; then cp dixy.sh release-staging/dixy.sh; chmod +x release-staging/dixy.sh; fi
          if [ -f dixy.bat ]; then cp dixy.bat release-staging/dixy.bat; fi
          (cd release-staging && sha256sum dixy-cli.jar dixy-agent.jar > SHA256SUMS)

      - name: Verify release artifacts
        run: |
          ls -la release-staging/
          for jar in release-staging/*.jar; do
            if unzip -l "$jar" | grep -q '\.java$'; then
              echo "::error::Source files found inside $jar — aborting release."
              exit 1
            fi
          done
          echo "Verified: Compiled binary artifacts ready for release."

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: DIXY ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-staging/dixy-agent.jar
            release-staging/dixy-cli.jar
            release-staging/dixy.sh
            release-staging/dixy.bat

      - name: Publish to public DIXY-CLI repo (if configured)
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        if: env.RELEASES_TOKEN != ''
        uses: softprops/action-gh-release@v2
        with:
          repository: roy-gunjan743/DIXY-CLI
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: DIXY ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            release-staging/dixy-agent.jar
            release-staging/dixy-cli.jar
            release-staging/dixy.sh
            release-staging/dixy.bat
            release-staging/VERSION
            release-staging/SHA256SUMS
            release-staging/VERSION
            release-staging/SHA256SUMS