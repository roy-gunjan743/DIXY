name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make

      - name: Build native JVMTI library
        run: |
          cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build --config Release

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build application and agent jars
        run: ./gradlew bootJar jar --no-daemon

      - name: Build Docker image
        run: |
          docker build -f src/main/java/com/virtual_deadlock_detection/devOps/dev.dockerfile -t patent_26-app:ci .
