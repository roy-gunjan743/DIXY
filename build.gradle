import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar
plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
    id 'com.gradleup.shadow' version '8.3.9'
}

group = 'com.dixy'
version = '0.0.1-SNAPSHOT'
description = 'virtual_deadlock_detection'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    agentRuntime
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.0'
    testImplementation 'org.testcontainers:postgresql:1.21.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.shell:spring-shell-starter:4.0.3'
    implementation 'org.springframework.shell:spring-shell-jline:4.0.3'

    // Minimal runtime for the standalone -javaagent jar only — deliberately
    // NOT the full runtimeClasspath, since the agent attaches to someone
    // else's bare `java -jar` and shouldn't drag in JPA/Redis/Security/etc.
    agentRuntime 'org.slf4j:slf4j-api:2.0.16'
    agentRuntime 'org.slf4j:slf4j-simple:2.0.16'
    agentRuntime 'jakarta.annotation:jakarta.annotation-api:2.1.1'
}
bootJar {
    archiveClassifier = ''
}

jar {
    enabled = true

    archiveClassifier = 'plain'

    manifest {
        attributes(
                "Premain-Class": "com.virtual_deadlock_detection.LockDetectionAgent.agent.VirtualDeadlockAgent",
                "Can-Redefine-Classes": "true",
                "Can-Retransform-Classes": "true"
        )
    }
}

tasks.register('agentJar', ShadowJar) {
    archiveClassifier = 'agent'
    from sourceSets.main.output
    exclude 'application*.yml', 'application*.properties'
    configurations = [project.configurations.agentRuntime]
    relocate 'org.slf4j', 'com.virtual_deadlock_detection.shaded.slf4j'
    manifest {
        attributes(
                "Premain-Class": "com.virtual_deadlock_detection.LockDetectionAgent.agent.VirtualDeadlockAgent",
                "Can-Redefine-Classes": "true",
                "Can-Retransform-Classes": "true"
        )
    }
}
tasks.named('test') {
    useJUnitPlatform()
    forkEvery = 1
    systemProperty 'user.timezone', 'UTC'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.named('bootRun') {
    jvmArgs += ['-Duser.timezone=UTC']
}

publishing {
    publications {
        // Publishes the plain (agent) jar produced by the `jar` task, using
        // the standard Java component (pom with your dependencies included).
        gpr(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'virtual-deadlock-detection'
            version = project.version

            // Also attach the runnable Spring Boot fat jar, and the
            // standalone -javaagent jar, as extra artifacts.
            artifact(bootJar) {
                classifier = 'boot'
            }
            artifact(agentJar) {
                classifier = 'agent'
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/roy-gunjan743/DIXY")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}