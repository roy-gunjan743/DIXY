plugins {
    id 'java'
    id 'maven-publish'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.jetbrains.kotlin.jvm'
}

group = 'com.dixy'
version = '0.0.1-SNAPSHOT'
description = 'virtual_deadlock_detection'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter:1.21.0'
    testImplementation 'org.testcontainers:postgresql:1.21.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation 'org.springframework.shell:spring-shell-starter:3.4.0'

}
bootJar {
    archiveClassifier = ''
}

jar {
    enabled = true
    archiveClassifier = 'plain'

    manifest {
        attributes(
                "Premain-Class": "com.virtual_deadlock_detection.LockDetectionAgent.agent.VirtualDeadlockAgent",
                "Can-Redefine-Classes": "true",
                "Can-Retransform-Classes": "true"
        )
    }
}
tasks.named('test') {
    useJUnitPlatform()
    forkEvery = 1
    systemProperty 'user.timezone', 'UTC'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

tasks.named('bootRun') {
    jvmArgs += ['-Duser.timezone=UTC']
}

publishing {
    publications {
        // Publishes the plain (agent) jar produced by the `jar` task, using
        // the standard Java component (pom with your dependencies included).
        gpr(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'virtual-deadlock-detection'
            version = project.version

            // Also attach the runnable Spring Boot fat jar as an extra
            // artifact with a "boot" classifier so both are available.
            artifact(bootJar) {
                classifier = 'boot'
            }
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/roy-gunjan743/DIXY")
            credentials {
                username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
                password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
            }
        }
    }
}